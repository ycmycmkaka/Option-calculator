<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Advanced Option Calculator</title>

<style>
  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f4f7fb;
    color:#132238;
  }

  .container{
    max-width:1200px;
    margin:auto;
    padding:24px;
  }

  h1{
    margin-top:0;
    font-size:38px;
  }

  .subtitle{
    color:#5d6b7b;
    margin-bottom:28px;
  }

  .panel{
    background:white;
    border-radius:20px;
    padding:24px;
    margin-bottom:24px;
    box-shadow:0 8px 24px rgba(0,0,0,0.06);
  }

  h2{
    margin-top:0;
    margin-bottom:10px;
  }

  .desc{
    color:#667689;
    line-height:1.6;
    margin-bottom:24px;
  }

  .form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
    margin-bottom:22px;
  }

  label{
    display:flex;
    flex-direction:column;
    gap:8px;
    font-weight:600;
  }

  input,select{
    padding:12px;
    border-radius:12px;
    border:1px solid #d6deea;
    font-size:15px;
  }

  button{
    border:none;
    background:#1f7cff;
    color:white;
    padding:14px 18px;
    border-radius:14px;
    cursor:pointer;
    font-size:15px;
    font-weight:700;
  }

  button:hover{
    filter:brightness(1.05);
  }

  .result{
    margin-top:24px;
  }

  .result-box{
    background:#f8fbff;
    border:1px solid #d6e7ff;
    border-radius:16px;
    padding:18px;
    line-height:1.8;
  }

  .profit{
    color:#0f9d58;
    font-weight:700;
  }

  .loss{
    color:#d93025;
    font-weight:700;
  }

  .best-box{
    background:#edf9f0;
    border:1px solid #b8ebc4;
    border-radius:16px;
    padding:18px;
    margin-bottom:20px;
  }

  table{
    width:100%;
    border-collapse:collapse;
    margin-top:18px;
    overflow:hidden;
    border-radius:14px;
  }

  th,td{
    border:1px solid #dde5f0;
    padding:12px;
    text-align:center;
  }

  th{
    background:#f3f6fb;
  }

  .best-row{
    background:#e8f7ec;
    font-weight:700;
  }

  .warning{
    color:#d93025;
    font-weight:700;
  }

  @media(max-width:768px){

    h1{
      font-size:30px;
    }

    .container{
      padding:16px;
    }

  }
</style>
</head>

<body>

<div class="container">

  <h1>Advanced Option Calculator</h1>

  <div class="subtitle">
    Black-Scholes 理論價 + Profit 分析 + 最佳 Option 比較
  </div>

  <!-- 基本 Black-Scholes -->

  <section class="panel">

    <h2>Black-Scholes 理論價</h2>

    <div class="form-grid">

      <label>
        Option Type
        <select id="optionType">
          <option value="call">Call</option>
          <option value="put">Put</option>
        </select>
      </label>

      <label>
        Stock Price
        <input id="spotPrice" type="number" value="100" step="0.01">
      </label>

      <label>
        Strike Price
        <input id="strikePrice" type="number" value="105" step="0.01">
      </label>

      <label>
        IV %
        <input id="iv" type="number" value="60" step="0.1">
      </label>

      <label>
        Risk-free Rate %
        <input id="rate" type="number" value="4.5" step="0.1">
      </label>

      <label>
        Days to Expiry
        <input id="days" type="number" value="30">
      </label>

    </div>

    <button onclick="calculateOption()">
      計算理論價
    </button>

    <div id="optionResult" class="result"></div>

  </section>

  <!-- 功能一 -->

  <section class="panel">

    <h2>功能一：到期時賺幾多 %？</h2>

    <div class="form-grid">

      <label>
        買入 Option 價格
        <input id="entryPremium" type="number" value="5" step="0.01">
      </label>

      <label>
        到期時股價
        <input id="targetPrice" type="number" value="120" step="0.01">
      </label>

    </div>

    <button onclick="calculateProfitScenario()">
      計算 Profit
    </button>

    <div id="profitResult" class="result"></div>

  </section>

  <!-- 功能二 -->

  <section class="panel">

    <h2>功能二：邊張 Option 最賺？</h2>

    <p class="desc">
      系統會自動根據現價生成唔同 Strike，
      再用 Black-Scholes 理論價比較邊張回報率最高。
    </p>

    <div class="form-grid">

      <label>
        Underlying 現價
        <input id="bestSpot" type="number" value="100" step="0.01">
      </label>

      <label>
        預計到期股價
        <input id="bestFinalPrice" type="number" value="130" step="0.01">
      </label>

      <label>
        IV %
        <input id="bestIv" type="number" value="60" step="0.1">
      </label>

      <label>
        Risk-free Rate %
        <input id="bestRate" type="number" value="4.5" step="0.1">
      </label>

      <label>
        Days to Expiry
        <input id="bestDays" type="number" value="30">
      </label>

    </div>

    <button onclick="calculateBestOption()">
      分析最佳 Option
    </button>

    <div id="bestOptionResult" class="result"></div>

  </section>

</div>

<script>

function erf(x){

  const sign = x >= 0 ? 1 : -1;

  x = Math.abs(x);

  const a1 = 0.254829592;
  const a2 = -0.284496736;
  const a3 = 1.421413741;
  const a4 = -1.453152027;
  const a5 = 1.061405429;
  const p = 0.3275911;

  const t = 1 / (1 + p * x);

  const y =
    1 -
    (((((a5 * t + a4) * t + a3) * t + a2) * t + a1)
      * t
      * Math.exp(-x * x));

  return sign * y;
}

function normCDF(x){
  return (1 + erf(x / Math.sqrt(2))) / 2;
}

function blackScholes(optionType,S,K,T,r,sigma){

  if(T <= 0){
    return optionType === "call"
      ? Math.max(S-K,0)
      : Math.max(K-S,0);
  }

  const d1 =
    (Math.log(S/K)+(r+0.5*sigma*sigma)*T)
    /(sigma*Math.sqrt(T));

  const d2 =
    d1 - sigma*Math.sqrt(T);

  if(optionType === "call"){

    return S*normCDF(d1)
      - K*Math.exp(-r*T)*normCDF(d2);

  }else{

    return K*Math.exp(-r*T)*normCDF(-d2)
      - S*normCDF(-d1);

  }
}

function calculateOption(){

  const type =
    document.getElementById("optionType").value;

  const S =
    parseFloat(document.getElementById("spotPrice").value);

  const K =
    parseFloat(document.getElementById("strikePrice").value);

  const iv =
    parseFloat(document.getElementById("iv").value)/100;

  const r =
    parseFloat(document.getElementById("rate").value)/100;

  const days =
    parseFloat(document.getElementById("days").value);

  const T = days/365;

  const price =
    blackScholes(type,S,K,T,r,iv);

  document.getElementById("optionResult").innerHTML = `
    <div class="result-box">
      <strong>理論價格：</strong>
      $${price.toFixed(2)}
    </div>
  `;
}

function calculateProfitScenario(){

  const type =
    document.getElementById("optionType").value;

  const K =
    parseFloat(document.getElementById("strikePrice").value);

  const premium =
    parseFloat(document.getElementById("entryPremium").value);

  const target =
    parseFloat(document.getElementById("targetPrice").value);

  let expiryValue = 0;

  if(type === "call"){
    expiryValue = Math.max(target-K,0);
  }else{
    expiryValue = Math.max(K-target,0);
  }

  const profit =
    expiryValue-premium;

  const returnPct =
    (profit/premium)*100;

  const className =
    returnPct >= 0 ? "profit" : "loss";

  document.getElementById("profitResult").innerHTML = `
    <div class="result-box">

      <div>
        <strong>到期內在價值：</strong>
        $${expiryValue.toFixed(2)}
      </div>

      <div>
        <strong>Profit：</strong>
        $${profit.toFixed(2)}
      </div>

      <div class="${className}">
        <strong>回報率：</strong>
        ${returnPct.toFixed(2)}%
      </div>

    </div>
  `;
}

function calculateBestOption(){

  const S =
    parseFloat(document.getElementById("bestSpot").value);

  const finalPrice =
    parseFloat(document.getElementById("bestFinalPrice").value);

  const iv =
    parseFloat(document.getElementById("bestIv").value)/100;

  const r =
    parseFloat(document.getElementById("bestRate").value)/100;

  const days =
    parseFloat(document.getElementById("bestDays").value);

  const T = days/365;

  const strikePercents =
    [0,2,5,10,20,30,50,75,100];

  let rows = [];

  let best = null;

  strikePercents.forEach(percent=>{

    const K =
      S*(1+percent/100);

    const premium =
      blackScholes("call",S,K,T,r,iv);

    const expiryValue =
      Math.max(finalPrice-K,0);

    const profit =
      expiryValue-premium;

    const returnPct =
      premium > 0
      ? (profit/premium)*100
      : -100;

    const row = {
      percent,
      strike:K,
      premium,
      expiryValue,
      profit,
      returnPct
    };

    rows.push(row);

    if(!best || row.returnPct > best.returnPct){
      best = row;
    }

  });

  let html = `

    <div class="best-box">

      <div>
        <strong>最佳 Strike：</strong>
        ${best.strike.toFixed(2)}
        (${best.percent === 0 ? "ATM" : "+"+best.percent+"%"})
      </div>

      <div>
        <strong>理論買入價：</strong>
        $${best.premium.toFixed(2)}
      </div>

      <div>
        <strong>到期價值：</strong>
        $${best.expiryValue.toFixed(2)}
      </div>

      <div>
        <strong>Profit：</strong>
        $${best.profit.toFixed(2)}
      </div>

      <div class="profit">
        <strong>回報率：</strong>
        ${best.returnPct.toFixed(2)}%
      </div>

    </div>

    <table>

      <thead>

        <tr>
          <th>距離現價</th>
          <th>Strike</th>
          <th>理論價</th>
          <th>到期價值</th>
          <th>Profit</th>
          <th>回報率</th>
        </tr>

      </thead>

      <tbody>

  `;

  rows.forEach(row=>{

    const cls =
      row === best ? "best-row" : "";

    html += `

      <tr class="${cls}">

        <td>
          ${row.percent === 0 ? "ATM" : "+"+row.percent+"%"}
        </td>

        <td>
          ${row.strike.toFixed(2)}
        </td>

        <td>
          $${row.premium.toFixed(2)}
        </td>

        <td>
          $${row.expiryValue.toFixed(2)}
        </td>

        <td>
          $${row.profit.toFixed(2)}
        </td>

        <td>
          ${row.returnPct.toFixed(2)}%
        </td>

      </tr>

    `;

  });

  html += `
      </tbody>
    </table>
  `;

  document.getElementById("bestOptionResult").innerHTML =
    html;
}

</script>

</body>
</html>
